[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "alt-celery3"
version = "0.1.0"
description = "A Docker-ready, production-oriented Celery application (Python >= 3.13) with example plain & periodic tasks, Flower monitoring and a password-protected Redis broker."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "alt_celery3 maintainers" }]
keywords = ["celery", "redis", "redis-stack", "flower", "task-queue", "docker", "beat"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Celery",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    # The Docker image installs the same set from requirements.txt.
    "celery[redis]>=5.5.0,<6",
    "flower>=2.0.1,<3",
    "redis>=5.2.0,<7",
    "python-dotenv>=1.0.0,<2",
    # OpenAI-compatible SDK used to call the SiliconFlow Chat Completion API.
    "openai>=1.0,<3",
    # --- Custom packages (installed from GitHub) -----------------------------
    # High-performance MySQL client wrapper (MySQLdb + connection pool).
    "scdb-mysql-speed @ git+https://github.com/gujiahui234/sql_speed.git",
    # Simulated Chinese class roster generator (import name: class_roster).
    "class-roster-simulator @ git+https://github.com/gujiahui234/class_roster_simulator-0.1.0.git",
    # Loguru extension: console/file/async-batched MySQL logging.
    "sclog-lite @ git+https://github.com/gujiahui234/sclog_lite.git",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.6,<1",
    "mypy>=1.10,<2",
]

[project.urls]
Homepage = "https://github.com/example/alt_celery3"

[tool.setuptools]
packages = ["app", "app.tasks"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".venv", "data"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
